name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: "false"
      - name: Install
        run: echo y | make
      - name: Load bashrc
        run: source ~/.bashrc
      - name: Install gitconfig
        run: make gitconfig
        env:
          GIT_USER_NAME: example_user_name
          GIT_USER_EMAIL: example_user_email
